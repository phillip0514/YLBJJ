</head>
<body class="bg-white text-ink-900 antialiased">

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md border-b border-ink-200 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="text-lg font-bold tracking-tight">元朗柔術 <span class="text-dojo-700">Yuen Long Jiu-Jitsu</span></a>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="index.html" class="text-ink-600 hover:text-ink-900 transition-colors">首頁</a>
          <a href="index.html#intro" class="text-ink-600 hover:text-ink-900 transition-colors">拳館簡介</a>
          <a href="index.html#timetable" class="text-ink-600 hover:text-ink-900 transition-colors">課堂時間表</a>
          <a href="members.html" class="text-ink-600 hover:text-ink-900 transition-colors">教練及成員</a>
          <a href="gallery.html" class="text-ink-900 transition-colors">拳館相簿</a>
        </div>
        <button id="mobile-menu-btn" class="md:hidden p-2 -mr-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden border-t border-ink-200 bg-white">
      <div class="px-6 py-4 space-y-3 text-sm font-medium">
        <a href="index.html" class="block text-ink-600 hover:text-ink-900">首頁</a>
        <a href="index.html#intro" class="block text-ink-600 hover:text-ink-900">拳館簡介</a>
        <a href="index.html#timetable" class="block text-ink-600 hover:text-ink-900">課堂時間表</a>
        <a href="members.html" class="block text-ink-600 hover:text-ink-900">教練及成員</a>
        <a href="gallery.html" class="block text-ink-900 font-semibold">拳館相簿</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="pt-32 pb-16 lg:pt-40 lg:pb-24">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 text-center">
      <h1 class="text-4xl md:text-6xl font-black tracking-tighter mb-4">拳館相簿</h1>
      <p class="text-ink-600 max-w-2xl mx-auto text-lg">捕捉拳館每個訓練時刻同難忘回憶</p>
    </div>
  </header>

  <!-- Gallery Grid -->
  <main class="max-w-7xl mx-auto px-6 lg:px-8 pb-24">
    <div id="gallery-container" class="masonry">
      <!-- Rendered by JS -->
    </div>
    <p class="text-center text-ink-400 mt-10 text-sm">歡迎 WhatsApp 我哋查詢相片用途</p>
  </main>

  <!-- Footer -->
  <footer class="border-t border-ink-200 bg-ink-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-12 flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="text-sm text-ink-500">© 2026 Yuen Long Jiu-Jitsu. All rights reserved.</p>
      <a href="https://wa.me/85266296630?text=%F0%9F%A5%8A%E5%85%83%E6%9C%97%E6%9F%94%E8%A1%93%20YLJJ%20-%20%E6%88%91%E6%83%B3%E9%A0%90%E7%B4%84%E4%B8%80%E5%80%8B%E8%A9%A6%E5%A0%82"
         target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-ink-900 text-white px-6 py-3 rounded-full text-sm font-semibold hover:bg-ink-800 transition-colors">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.365.195 1.88.118.574-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.511-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        立即預約
      </a>
    </div>
  </footer>

  <script>
    // 請將相簿圖片放入 images/ 資料夾，並在下方陣列加入項目
    // 支援兩種格式：
    // { type: 'image', src: 'images/你的相.jpg', caption: '說明' }
    // { type: 'video', thumbnail: 'images/你的截圖.jpg', caption: '說明', url: 'https://instagram.com/...' }
    const galleryItems = [
      { type: 'image', src: 'images/相簿_001.PNG', caption: '2025 元朗柔術聖誕 Party' },
      { type: 'image', src: 'images/相簿_002.PNG', caption: '團年飯大食會兼升帶儀式 - 內有 Coach Ming' },
      { type: 'image', src: 'images/相簿_003.PNG', caption: 'Hong Kong Fight 總冠軍！贏咗條腰帶！' }
    ];

    function renderGallery() {
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      galleryItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'break-inside-avoid mb-4';

        if (item.type === 'image') {
          card.innerHTML = `
            <div class="group relative overflow-hidden rounded-xl bg-ink-100 cursor-pointer" onclick="openLightbox(${index})">
              <img src="${item.src}" alt="${item.caption}" class="w-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy">
              <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300"></div>
              <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <p class="text-white text-sm font-medium">${item.caption}</p>
              </div>
            </div>
          `;
        } else if (item.type === 'video') {
          card.innerHTML = `
            <div class="group relative overflow-hidden rounded-xl bg-ink-100 cursor-pointer" onclick="window.open('${item.url}', '_blank')">
              <img src="${item.thumbnail}" alt="${item.caption}" class="w-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy">
              <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-14 h-14 bg-white/90 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-lg">
                  <svg class="w-6 h-6 text-ink-900 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
              <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <p class="text-white text-sm font-medium">${item.caption}</p>
              </div>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }

    function openLightbox(index) {
      const item = galleryItems[index];
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4';
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      overlay.innerHTML = `
        <button class="absolute top-4 right-4 text-white/80 hover:text-white p-2" onclick="this.closest('.fixed').remove()">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <img src="${item.src}" alt="${item.caption}" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
        <p class="text-white text-center mt-4 text-sm font-medium">${item.caption}</p>
      `;
      document.body.appendChild(overlay);
    }

    // Mobile menu toggle
    document.getElementById('mobile-menu-btn').addEventListener('click', function() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    // Init
    renderGallery();
  </script>
</body>
</html>
