<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿 | 元朗柔術</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            ink: { 50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4', 400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040', 800: '#262626', 900: '#171717' },
            dojo: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' }
          }
        }
      }
    }
  </script>
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .photo-item {
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .photo-item:hover img {
      transform: scale(1.05);
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }
  </style>
</head>
<body class="bg-white text-ink-900 antialiased">

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md border-b border-ink-200 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="text-lg font-bold tracking-tight">元朗柔術 <span class="text-dojo-700">Yuen Long Jiu-Jitsu</span></a>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="index.html#timetable" class="text-ink-600 hover:text-ink-900 transition-colors">課堂時間表</a>
          <a href="members.html" class="text-ink-600 hover:text-ink-900 transition-colors">教練及成員</a>
          <a href="gallery.html" class="text-ink-900 font-semibold">拳館相簿</a>
          <a href="index.html#contact" class="bg-ink-900 text-white px-4 py-2 rounded-full text-sm hover:bg-ink-800 transition-colors">立即預約</a>
        </div>
        <button id="mobile-menu-btn" class="md:hidden p-2 -mr-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-ink-200 bg-white px-6 py-4 space-y-2">
      <a href="index.html#timetable" class="block text-ink-600 hover:text-ink-900">課堂時間表</a>
      <a href="members.html" class="block text-ink-600 hover:text-ink-900">教練及成員</a>
      <a href="gallery.html" class="block text-ink-900 font-semibold">拳館相簿</a>
      <a href="index.html#contact" class="block text-ink-900 font-semibold">立即預約</a>
    </div>
  </nav>

  <script>
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });
  </script>

  <!-- Main Content -->
  <main class="pt-24 pb-16 max-w-7xl mx-auto px-6 lg:px-8">
    <h1 class="text-4xl font-bold mb-2">拳館相簿</h1>
    <p class="text-ink-500 mb-10">元朗柔術嘅點滴</p>
    
    <div class="photo-grid" id="photo-grid"></div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="absolute top-4 right-6 text-white text-3xl cursor-pointer">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const photos = [
      'images/相簿_001.jpg',
      'images/相簿_002.jpg',
      'images/相簿_003.jpg',
      'images/相簿_004.jpg',
      'images/相簿_005.jpg',
      'images/相簿_006.jpg',
      'images/相簿_007.jpg'
    ];

    const grid = document.getElementById('photo-grid');
    photos.forEach(src => {
      const item = document.createElement('div');
      item.className = 'photo-item cursor-pointer';
      item.innerHTML = `<img src="${src}" alt="" loading="lazy">`;
      item.onclick = () => openLightbox(src);
      grid.appendChild(item);
    });

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
