<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教練及成員 | 元朗柔術</title>
  <meta name="description" content="認識元朗柔術嘅教練、拳手同會員團隊。">
  <link rel="icon" type="image/png" href="images/yl-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            ink: { 50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4', 400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040', 800: '#262626', 900: '#171717' },
            dojo: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' }
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .filter-active { color: #171717; border-bottom: 2px solid #171717; font-weight: 600; }
    .filter-inactive { color: #737373; border-bottom: 2px solid transparent; }
    .filter-inactive:hover { color: #171717; }
  </style>
</head>
<body class="bg-white text-ink-900 antialiased">

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md border-b border-ink-200 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="flex items-center gap-3">
          <img src="images/yl-logo.png" alt="元朗柔術 Logo" class="h-10 w-auto">
          <span class="text-base font-bold tracking-tight">元朗柔術 <span class="text-dojo-700">Yuen Long Jiu-Jitsu</span></span>
        </a>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="index.html#timetable" class="text-ink-600 hover:text-ink-900 transition-colors">課堂時間表</a>
          <a href="members.html" class="text-ink-900 font-semibold">教練及成員</a>
          <a href="gallery.html" class="text-ink-600 hover:text-ink-900 transition-colors">拳館相簿</a>
          <a href="index.html#contact" class="bg-ink-900 text-white px-4 py-2 rounded-full text-sm hover:bg-ink-800 transition-colors">立即預約</a>
        </div>
        <button id="mobile-menu-btn" class="md:hidden p-2 -mr-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden border-t border-ink-200 bg-white px-6 py-4 space-y-2">
      <a href="index.html#timetable" class="block text-ink-600 hover:text-ink-900">課堂時間表</a>
      <a href="members.html" class="block text-ink-900 font-semibold">教練及成員</a>
      <a href="gallery.html" class="block text-ink-600 hover:text-ink-900">拳館相簿</a>
      <a href="index.html#contact" class="block text-ink-900 font-semibold">立即預約</a>
    </div>
  </nav>

  <!-- Header -->
  <header class="pt-32 pb-16 lg:pt-40 lg:pb-24">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 text-center">
      <h1 class="text-4xl md:text-6xl font-black tracking-tighter mb-4">教練及成員</h1>
      <p class="text-ink-600 max-w-2xl mx-auto text-lg">認識我哋嘅教練團隊、拳手同埋一班熱愛訓練嘅會員。</p>
    </div>
  </header>

  <!-- Filters -->
  <div class="max-w-7xl mx-auto px-6 lg:px-8 mb-12">
    <div class="flex justify-center flex-wrap border-b border-ink-200">
      <button onclick="filterMembers('all')" id="filter-all" class="filter-active px-5 py-3 text-sm font-medium transition-colors">全部</button>
      <button onclick="filterMembers('cat')" id="filter-cat" class="filter-inactive px-5 py-3 text-sm font-medium transition-colors">喵</button>
      <button onclick="filterMembers('coach')" id="filter-coach" class="filter-inactive px-5 py-3 text-sm font-medium transition-colors">教練</button>
      <button onclick="filterMembers('fighter')" id="filter-fighter" class="filter-inactive px-5 py-3 text-sm font-medium transition-colors">拳手</button>
      <button onclick="filterMembers('member')" id="filter-member" class="filter-inactive px-5 py-3 text-sm font-medium transition-colors">會員</button>
    </div>
  </div>

  <!-- Members Grid -->
  <main class="max-w-7xl mx-auto px-6 lg:px-8 pb-24">
    <div id="members-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Rendered by JS -->
    </div>
    <p id="no-results" class="hidden text-center text-ink-500 py-20 text-lg">冇符合篩選條件嘅成員</p>
  </main>

  <!-- Footer -->
  <footer class="border-t border-ink-200 bg-ink-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-12 flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="text-sm text-ink-500">© 2026 Yuen Long Jiu-Jitsu. All rights reserved.</p>
      <a href="https://wa.me/85266296630?text=%F0%9F%A5%8A%E5%85%83%E6%9C%97%E6%9F%94%E8%A1%93%20YLJJ%20-%20%E6%88%91%E6%83%B3%E9%A0%90%E7%B4%84%E4%B8%80%E5%80%8B%E8%A9%A6%E5%A0%82"
         target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-ink-900 text-white px-6 py-3 rounded-full text-sm font-semibold hover:bg-ink-800 transition-colors">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.365.195 1.88.118.574-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.511-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        立即預約
      </a>
    </div>
  </footer>

  <script>
    let allMembers = [];

    async function loadMembers() {
      try {
        const res = await fetch('data.json');
        if (!res.ok) throw new Error('Failed to load data.json');
        allMembers = await res.json();
        renderMembers('all');
      } catch (err) {
        console.error(err);
        document.getElementById('members-grid').innerHTML = '<p class="text-center text-ink-500 col-span-full">載入失敗，請稍後再試</p>';
      }
    }

    function renderMembers(filter) {
      const grid = document.getElementById('members-grid');
      const noResults = document.getElementById('no-results');
      const filtered = allMembers.filter(m => {
        if (filter === 'all') return true;
        const role = (m.role || '').toLowerCase();
        const isCat = m.category === 'cat' || role.includes('喵') || role.includes('拳館貓');
        if (filter === 'cat') return isCat;
        if (isCat) return false;
        if (filter === 'coach') return role.includes('教練') || role.includes('coach');
        if (filter === 'fighter') return role.includes('拳手') || role.includes('fighter');
        if (filter === 'member') return role.includes('會員') || role.includes('member') || m.category === 'member' || m.show_in_members;
        return true;
      });

      // Pull 木村 out and pin to top, then shuffle the rest randomly
      const kimuraEntry = filtered.find(m => m.id === 'kimura');
      let ordered = filtered.filter(m => m.id !== 'kimura');
      for (let i = ordered.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
      }
      if (kimuraEntry) ordered = [kimuraEntry, ...ordered];

      const isCatFilter = filter === 'cat';
      const isFeaturedCat = isCatFilter && !!kimuraEntry;
      grid.innerHTML = '';
      noResults.classList.add('hidden');

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }

      ordered.forEach((member, idx) => {
        // Replace "學員" with "會員" in role display
        const displayRole = member.role.replace(/學員/g, '會員');

        const isFeatured = isFeaturedCat && idx === 0;
        const card = document.createElement('a');
        card.href = `profile.html?id=${member.id}`;
        card.className = isFeatured
          ? 'group block bg-white border border-ink-200 rounded-2xl overflow-hidden hover:border-ink-900 hover:shadow-xl transition-all duration-300 md:col-span-2 lg:col-span-3'
          : 'group block bg-white border border-ink-200 rounded-2xl overflow-hidden hover:border-ink-900 hover:shadow-lg transition-all duration-300';
        const hasGallery = member.images && member.images.length > 1;
        const galleryTotal = hasGallery ? member.images.length : 0;
        const dotsHtml = hasGallery ? `<div class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5">
          ${member.images.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i===0?'bg-white':'bg-white/40'}"></span>`).join('')}
        </div>` : '';
        let coverHtml;
        const isVideoCover = (member.photo || '').match(/\.(mp4|mov|webm)(\?|$)/i);
        if (isVideoCover) {
          const poster = member.photo_poster || '';
          const sources = [];
          if (member.photo) sources.push(`<source src="${member.photo}" type="video/mp4">`);
          // Fallback chain from images[] in case photo isn't a video URL
          (member.images || []).forEach(img => {
            if (img.type === 'video' && img.src !== member.photo) {
              sources.push(`<source src="${img.src}" type="video/mp4">`);
            }
          });
          coverHtml = `
            <video autoplay muted loop playsinline preload="metadata"${poster ? ` poster="${poster}"` : ''} class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" aria-label="${member.name} 影片封面">
              ${sources.join('')}
            </video>`;
        } else {
          coverHtml = `<img src="${member.photo}" alt="${member.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy">`;
        }

        const aspectClass = isFeatured ? 'aspect-[3/4]' : 'aspect-[4/5]';
        const coverWrapClass = isFeatured
          ? 'bg-ink-100 overflow-hidden relative aspect-[3/4] max-h-[640px] mx-auto w-full max-w-[480px]'
          : `${aspectClass} bg-ink-100 overflow-hidden relative`;
        const secondaryRoleHtml = member.secondary_role
          ? `<span class="inline-flex w-fit items-center gap-2 bg-white/80 backdrop-blur-sm text-dojo-700 text-xs font-bold tracking-wider uppercase px-3 py-1.5 rounded-full mb-3 border border-dojo-200">🐾 ${member.role} · ${member.secondary_role}</span>`
          : `<span class="inline-flex w-fit items-center gap-2 bg-white/80 backdrop-blur-sm text-dojo-700 text-xs font-bold tracking-wider uppercase px-3 py-1.5 rounded-full mb-3 border border-dojo-200">🐾 ${member.role}</span>`;
        const statBlocks = [];
        if (member.signature_move) {
          statBlocks.push(`<div class="bg-white/80 backdrop-blur-sm border border-ink-200 rounded-xl p-4"><div class="text-xs text-ink-500 mb-1 font-semibold uppercase tracking-wider">招牌技能</div><div class="text-base font-bold text-ink-900">⚡ ${member.signature_move}</div></div>`);
        }
        if (member.hobby) {
          statBlocks.push(`<div class="bg-white/80 backdrop-blur-sm border border-ink-200 rounded-xl p-4"><div class="text-xs text-ink-500 mb-1 font-semibold uppercase tracking-wider">隱藏愛好</div><div class="text-base font-bold text-ink-900">🎯 ${member.hobby}</div></div>`);
        }
        if (member.years) {
          statBlocks.push(`<div class="bg-white/80 backdrop-blur-sm border border-ink-200 rounded-xl p-4"><div class="text-xs text-ink-500 mb-1 font-semibold uppercase tracking-wider">習武年資</div><div class="text-base font-bold text-ink-900">${member.years}</div></div>`);
        }
        if (member.achievements) {
          statBlocks.push(`<div class="bg-white/80 backdrop-blur-sm border border-ink-200 rounded-xl p-4"><div class="text-xs text-ink-500 mb-1 font-semibold uppercase tracking-wider">戰績</div><div class="text-base font-bold text-ink-900">🏆 ${member.achievements}</div></div>`);
        }
        const cardBody = isFeatured ? `
          <div class="p-6 md:p-8 bg-gradient-to-br from-dojo-50 to-white">
            <div class="grid grid-cols-1 md:grid-cols-[420px_1fr] gap-6 md:gap-10 items-center">
              <div class="${coverWrapClass}">
                ${coverHtml}
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                ${member.signature_move ? `<div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm text-ink-800 text-xs font-medium px-3 py-1.5 rounded-full shadow">⚡ ${member.signature_move}</div>` : ''}
                ${hasGallery ? `<span class="absolute top-4 left-4 bg-black/60 backdrop-blur-md text-white text-[10px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full">📷 ${galleryTotal}</span>` : ''}
                ${hasGallery ? dotsHtml : ''}
              </div>
              <div>
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-6">
                  <div>
                    ${secondaryRoleHtml}
                    <h3 class="text-3xl md:text-4xl font-bold tracking-tight">${member.name}</h3>
                    ${member.name_en ? `<p class="text-sm text-ink-500 mt-1">${member.name_en}</p>` : ''}
                    ${member.secondary_role_note ? `<p class="text-xs text-ink-400 mt-1 italic">${member.secondary_role_note}</p>` : ''}
                  </div>
                  <span class="inline-flex items-center gap-2 bg-ink-900 text-white px-5 py-2.5 rounded-full text-sm font-semibold group-hover:bg-dojo-700 transition-colors w-fit">查看介紹 →</span>
                </div>
                ${member.quote ? `<p class="text-xl md:text-2xl text-ink-800 italic leading-relaxed mb-6 font-medium">"${member.quote}"</p>` : ''}
                ${member.bio ? `<p class="text-sm text-ink-600 leading-relaxed mb-6">${member.bio}</p>` : ''}
                ${statBlocks.length ? `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${statBlocks.join('')}</div>` : ''}
              </div>
            </div>
          </div>` : `
          <div class="${aspectClass} bg-ink-100 overflow-hidden relative">
            ${coverHtml}
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
            ${member.signature_move ? `<div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm text-ink-800 text-xs font-medium px-3 py-1.5 rounded-full shadow">⚡ ${member.signature_move}</div>` : ''}
            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent">
              <span class="text-white text-xs font-medium tracking-wider uppercase bg-white/20 backdrop-blur-md px-3 py-1 rounded-full">${displayRole}</span>
            </div>
            ${hasGallery ? `<span class="absolute top-4 left-4 bg-black/60 backdrop-blur-md text-white text-[10px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full">📷 ${galleryTotal}</span>${dotsHtml}` : ''}
          </div>
          <div class="p-5">
            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <h3 class="text-lg font-bold tracking-tight">${member.name}</h3>
                ${member.name_en ? `<p class="text-xs text-ink-500">${member.name_en}</p>` : ''}
              </div>
              ${member.bjj_belt && member.bjj_belt !== '冇帶' ? `
              <span class="inline-flex items-center gap-1.5 bg-ink-100 text-ink-700 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">
                <span class="w-2.5 h-2.5 rounded-full ${getBeltColor(member.bjj_belt)}"></span>
                ${member.bjj_belt}
              </span>` : ''}
            </div>
            ${member.quote ? `<p class="text-sm text-ink-600 italic line-clamp-2">"${member.quote}"</p>` : ''}
          </div>`;
        card.innerHTML = cardBody;
        grid.appendChild(card);
      });
    }

    function getBeltColor(belt) {
      if (!belt || belt === '冇帶') return 'hidden';
      const map = {
        '白帶': 'bg-white border-2 border-ink-300',
        '藍帶': 'bg-blue-600',
        '紫帶': 'bg-purple-600',
        '棕帶': 'bg-amber-800',
        '啡帶': 'bg-amber-700',
        '黑帶': 'bg-black'
      };
      return map[belt] || 'hidden';
    }

    function filterMembers(category) {
      document.querySelectorAll('[id^="filter-"]').forEach(btn => {
        btn.classList.remove('filter-active');
        btn.classList.add('filter-inactive');
      });
      const activeBtn = document.getElementById('filter-' + category);
      activeBtn.classList.remove('filter-inactive');
      activeBtn.classList.add('filter-active');
      renderMembers(category);
    }

    // Mobile menu toggle
    document.getElementById('mobile-menu-btn').addEventListener('click', function() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    // Init
    loadMembers();
  </script>
</body>
</html>
