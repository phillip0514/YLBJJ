  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function getBeltColor(belt) {
      if (!belt || belt === '冇帶') return 'hidden';
      const map = {
        '白帶': 'bg-white border-2 border-ink-300',
        '藍帶': 'bg-blue-600',
        '紫帶': 'bg-purple-600',
        '棕帶': 'bg-amber-800',
        '啡帶': 'bg-amber-700',
        '黑帶': 'bg-black'
      };
      return map[belt] || 'hidden';
    }

    function bioCard({ icon, label, content, list, accent }) {
      const bg = accent ? 'bg-dojo-50 border-dojo-200' : 'bg-ink-50 border-ink-200';
      const labelColor = accent ? 'text-dojo-700' : 'text-ink-500';
      const body = list
        ? `<ul class="space-y-1.5 ml-9 text-sm text-ink-700">${list.map(item => `
            <li class="flex items-baseline gap-2">
              <span class="w-1.5 h-1.5 bg-dojo-600 rounded-full mt-2 flex-shrink-0"></span>
              <span>${item}</span>
            </li>`).join('')}</ul>`
        : `<p class="text-base text-ink-800 leading-relaxed ml-9">${content}</p>`;
      return `
        <div class="${bg} border rounded-2xl p-6">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-2xl">${icon}</span>
            <span class="text-xs font-bold ${labelColor} uppercase tracking-widest">${label}</span>
          </div>
          ${body}
        </div>`;
    }

    function renderBioSections(m) {
      const sections = [];

      // 習武年資
      if (m.years && m.years.trim()) {
        sections.push(bioCard({ icon: '🎯', label: '習武年資', content: m.years }));
      }

      // 戰績 - case by case
      const hasBjj = m.achievements_bjj && m.achievements_bjj.trim();
      const hasBoxing = m.achievements_boxing && m.achievements_boxing.trim();
      const hasLegacy = m.achievements && m.achievements.trim();
      const hasSplit = hasBjj || hasBoxing;

      if (hasSplit) {
        // 拆 BJJ / Boxing 兩個 cards（如果齊料）
        if (hasBjj) {
          const list = m.achievements_bjj.split('\n').map(s => s.trim()).filter(Boolean);
          sections.push(bioCard({ icon: '🥋', label: 'Brazilian Jiu-Jitsu', list }));
        }
        if (hasBoxing) {
          const list = m.achievements_boxing.split('\n').map(s => s.trim()).filter(Boolean);
          sections.push(bioCard({ icon: '🥊', label: 'Boxing', list }));
        }
      } else if (hasLegacy) {
        // 唔分，做一個 generic card
        const list = m.achievements.split('\n').map(s => s.trim()).filter(Boolean);
        sections.push(bioCard({ icon: '🏆', label: '戰績', list }));
      }

      // 點解接觸武術
      if (m.reason && m.reason.trim()) {
        sections.push(bioCard({ icon: '❓', label: '點解接觸武術？', content: m.reason }));
      }

      // 擂台以外
      if (m.hobby && m.hobby.trim()) {
        sections.push(bioCard({ icon: '🎮', label: '擂台以外', content: m.hobby }));
      }

      // Fallback: 冇 structed fields 用舊 bio
      if (sections.length === 0 && m.bio && m.bio.trim()) {
        const paragraphs = m.bio.split(/\n\n+/);
        for (const p of paragraphs) {
          if (p.trim()) sections.push(`<p class="text-ink-700 leading-relaxed">${p.replace(/\n/g, '<br>')}</p>`);
        }
      }

      document.getElementById('bio-sections').innerHTML = sections.join('');
    }

    function renderProfile(member) {
      document.getElementById('profile-loading').classList.add('hidden');
      document.getElementById('profile-content').classList.remove('hidden');

      document.getElementById('member-photo').src = member.photo;
      document.getElementById('member-photo').alt = member.name;
      document.getElementById('member-role').textContent = member.role;
      document.getElementById('member-name').textContent = member.name;
      document.getElementById('member-move').textContent = member.signature_move;
      document.getElementById('member-quote').textContent = member.quote;

      renderBioSections(member);

      // Belt badge - hide for 冇帶 or empty
      const beltBadge = document.getElementById('belt-badge');
      if (member.bjj_belt && member.bjj_belt !== '冇帶') {
        beltBadge.classList.remove('hidden');
        const beltDot = document.getElementById('belt-dot');
        const beltColor = getBeltColor(member.bjj_belt);
        beltDot.className = 'w-3 h-3 rounded-full ' + beltColor;
        document.getElementById('belt-label').textContent = member.bjj_belt;
      } else {
        beltBadge.classList.add('hidden');
      }

      if (member.whatsapp && member.whatsapp !== 'BLINK001') {
        const waLink = document.getElementById('whatsapp-link');
        waLink.href = `https://wa.me/${member.whatsapp.replace(/\+/g, '')}?text=Hi%20${encodeURIComponent(member.name)},%20我喺元朗柔術網站見到你嘅 profile，想同你傾偈。`;
        waLink.classList.remove('hidden');
      } else {
        document.getElementById('whatsapp-link').classList.add('hidden');
      }

      if (member.instagram && member.instagram !== 'BLINK001') {
        const igLink = document.getElementById('instagram-link');
        igLink.href = member.instagram;
        igLink.classList.remove('hidden');
      } else {
        document.getElementById('instagram-link').classList.add('hidden');
      }

      document.title = `${member.name} | 元朗柔術`;
    }

    function showNotFound() {
      document.getElementById('profile-loading').classList.add('hidden');
      document.getElementById('profile-content').classList.add('hidden');
      document.getElementById('profile-not-found').classList.remove('hidden');
      document.title = '成員未找到 | 元朗柔術';
    }

    async function initProfile() {
      const id = getQueryParam('id');
      if (!id) {
        showNotFound();
        return;
      }

      try {
        const res = await fetch('data.json');
        if (!res.ok) throw new Error('Failed to load data.json');
        const members = await res.json();
        const member = members.find(m => m.id === id);
        if (member) {
          renderProfile(member);
        } else {
          showNotFound();
        }
      } catch (err) {
        console.error(err);
        showNotFound();
      }
    }

    // Mobile menu toggle
    document.getElementById('mobile-menu-btn').addEventListener('click', function() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    // Init
    initProfile();
  </script>
